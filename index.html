<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>蝗盟球球</title>
    <link rel="stylesheet" type="text/css" href="./styles/global.css">
  </head>
  <body style="text-align: center"> 
    <canvas id="unity-canvas" style="background: url('Build/') no-repeat center center fixed"></canvas>
    <body>
      <div id="loader">
        <img class="logo" src="logo.png">
        <div class="spinner"></div>
        <div class="progress"><div class="full"></div></div>
      </div>
    </body>

    <script>
  // 建立一個自動修正 Canvas 與 Unity 解析度的函數
  function fixUnitySize() {
    var canvas = document.querySelector("#unity-canvas");
    if (canvas) {
      // 1. 讓 Canvas 的渲染畫素直接等於網頁實際看到的寬高
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      
      // 2. 移除 BetterTemplate 限制比例的行內樣式
      canvas.style.width = "100vw";
      canvas.style.height = "100vh";
    }
  }

  // 當網頁大小改變、或者手機轉向時，立刻重新計算
  window.addEventListener('resize', fixUnitySize);
  window.addEventListener('orientationchange', fixUnitySize);

  // 由於 Unity 初始化需要時間，在載入完成後 1 秒與 3 秒強制重新刷新解析度
  setTimeout(fixUnitySize, 1000);
  setTimeout(fixUnitySize, 3000);
</script>

    <script src="Build/0716_WebTest.loader.js"></script>
    <script>
      var buildUrl = "Build";
      var config = {
        dataUrl: buildUrl + "/0716_WebTest.data",
        frameworkUrl: buildUrl + "/0716_WebTest.framework.js",
        codeUrl: buildUrl + "/0716_WebTest.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "darkert",
        productName: "蝗盟球球",
        productVersion: "1.0",
      };

      var gameInstance = createUnityInstance(
        document.querySelector("#unity-canvas"),
        config,
        UnityProgress);
      function UnityProgress(progress) {
        var loader = document.querySelector("#loader");
        var loaderProgress = document.querySelector("#loader .progress");

        var progressBar = loader.querySelector(".full");
        
        loaderProgress.style.display = "block";
        progressBar = loaderProgress.querySelector(".full");
        loader.querySelector(".spinner").style.display = "none";
        progressBar.style.transform = `scaleX(${progress})`;

        if (progress === 1) {
          loader.style.display = "none";
        }
      }
    </script>
  </body>
</html>
